[project]
name = "transcription"
version = "0.7.0"
description = "Standalone transcription microservice: local faster-whisper + litellm cloud providers, over localhost HTTP and a one-shot CLI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "faster-whisper>=1.2,<2",
  "litellm>=1.60",
  "h11>=0.16",
  "huggingface_hub>=0.35",
  # Markdown -> HTML -> PDF for reports and exports (pure-python stack).
  "markdown>=3.6",
  "xhtml2pdf>=0.2.16",
  # NVML bindings (pure-python ctypes over nvml.dll, no subprocess): how the
  # llama.cpp engine measures free VRAM to auto-fit `llm_gpu_layers`.
  # Harmless on machines with no NVIDIA driver -- only imported inside the
  # auto-fit path, behind a try/except.
  "nvidia-ml-py>=12",
]

[project.scripts]
transcription-service = "transcription.cli:main"

[project.optional-dependencies]
# CUDA runtime wheels for CTranslate2 4.8, which requires cuDNN 9 (not 8).
# Windows-only: F4's installer runs `uv sync --extra cuda` to bundle these.
cuda = [
  "nvidia-cublas-cu12>=12.3; sys_platform == 'win32'",
  "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32'",
]
# Speaker diarization (pyannote). Optional because it pulls the full torch
# stack (~GBs); the service degrades gracefully when it is absent and
# `diarize` is requested (the transcript is written without speakers and the
# failure is recorded in its `diarization` block).
diarization = [
  "pyannote.audio>=3.1,<4",
]
# The built-in LLM runtime (summaries / action items / facts / reports), as
# two mutually exclusive variants of the SAME pinned version -- the uv
# "conflicting extras" pattern (the torch cpu/cu convention). Pinned exactly:
# PyPI carries only sdists (needs CMake+MSVC); prebuilt wheels come from the
# project's own indexes (see [[tool.uv.index]] below), whose available
# versions drift. `llm-cpu` (~60 MB) is what the installer bakes; `llm-cuda`
# (~480 MB, bundles the CUDA 12.4 runtime DLLs) is what the dev sidecar
# selects on a machine with an NVIDIA GPU.
llm-cpu = [
  "llama-cpp-python==0.3.35",
]
llm-cuda = [
  "llama-cpp-python==0.3.35",
  # The cu124 wheel ships ggml-cuda.dll but NOT the CUDA runtime it links
  # against; these wheels put cudart64_12/cublas64_12 under
  # site-packages/nvidia/*/bin, which `runtime_dlls.register_cuda_dll_dirs`
  # already registers with the OS loader at service startup.
  "nvidia-cuda-runtime-cu12>=12.3,<13; sys_platform == 'win32'",
  "nvidia-cublas-cu12>=12.3,<13; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23,<2",
  "httpx>=0.27,<1",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.uv]
# The two LLM-runtime variants ship the same import name from different
# wheel indexes; installing both is impossible, so uv must treat the extras
# as mutually exclusive.
conflicts = [[{ extra = "llm-cpu" }, { extra = "llm-cuda" }]]

[[tool.uv.index]]
# llama-cpp-python's own wheel indexes: the only source of prebuilt Windows
# wheels (PyPI is sdist-only). `explicit = true` keeps every other package
# resolving from PyPI.
name = "llama-cpp-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "llama-cpp-cu124"
url = "https://abetlen.github.io/llama-cpp-python/whl/cu124"
explicit = true

[tool.uv.sources]
llama-cpp-python = [
  { index = "llama-cpp-cpu", extra = "llm-cpu" },
  { index = "llama-cpp-cu124", extra = "llm-cuda" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-q -m "not gpu"'
markers = [
  "gpu: needs the real large-v3 model and a CUDA device (opt-in)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 (assert) is bandit's blanket ban on `assert`; pytest relies on plain
# `assert` for its assertion rewriting, so it is expected in tests. The rest
# of the S ruleset (shell=True, subprocess misuse, ...) still applies here.
"tests/*" = ["S101"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# All of these are imported lazily inside their seam modules only; none
# ships usable type stubs.
module = ["llama_cpp.*", "xhtml2pdf.*", "markdown.*", "reportlab.*", "pynvml.*"]
ignore_missing_imports = true
