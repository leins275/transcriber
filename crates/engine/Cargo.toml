[package]
version = "0.9.0"
name = "engine"
edition = "2021"
description = "In-process transcription, diarization and LLM engine: the whole of what the Python service used to do"

[dependencies]
wire = { path = "../wire" }
# Model and runtime downloads. Separate crate on purpose: it is the only
# place outbound TLS lives.
fetcher = { path = "../fetcher" }
vault = { path = "../vault" }
serde = { version = "1", features = ["derive"] }
# Same reason as in the wire crate: exact float round-tripping is what keeps a
# rewritten document identical to the one on disk.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# `bundled` compiles SQLite from source rather than trusting whatever the host
# has: the ledger is a user's own history, and its schema migrations must not
# depend on a system library's version.
rusqlite = { version = "0.37", features = ["bundled"] }
# Speech to text. The sys crate also builds the one ggml both engines share;
# see crates/whisper-sys/PINS.md.
whisper-sys = { path = "../whisper-sys" }
# The LLM engine, and -- just as important -- the owner of the shared ggml
# whose backends both engines load at startup. Same feature set as
# whisper-sys's dependency on the sys crate, so there is exactly one ggml.
llama-cpp-2 = { version = "0.1.154", default-features = false, features = [
  "dynamic-backends",
] }
# `compression_ratio` is a deflate ratio -- faster-whisper reported it, and
# whisper.cpp does not, so it is computed here with the same definition.
flate2 = "1"
# Free-VRAM measurement for the GPU layer auto-fit. Loads the driver's own
# nvml.dll at runtime, so it links on a machine that has never had CUDA.
nvml-wrapper = "0.12"
# Incremental UTF-8 decoding of generated tokens. A token boundary can split a
# character, which for Cyrillic is the common case; llama-cpp-2's own API takes
# this decoder for exactly that reason.
encoding_rs = "0.8"
# Speaker diarization. `load-dynamic` keeps ONNX Runtime out of the build: the
# library is loaded from a DLL the installer ships, by absolute path, so the
# build never downloads a binary and a stray onnxruntime.dll earlier on PATH
# cannot shadow ours.
pyannote-rs = { version = "0.3.4", default-features = false, features = [
  "load-dynamic",
] }
# Pinned exactly, and not because we call it: pyannote-rs asks for
# `^2.0.0-rc.10`, but ort's release candidates change their tensor API between
# themselves, and rc.13 does not compile pyannote-rs at all. Naming the version
# here is what holds the resolver to one that does. Revisit when either
# reaches a stable release.
ort = { version = "=2.0.0-rc.10", default-features = false, features = [
  "load-dynamic",
] }
typst = "0.15"
typst-pdf = "0.15"
pulldown-cmark = "0.13"
typst-assets = { version = "0.15", features = ["fonts"] }
typst-layout = "0.15"

[dev-dependencies]
pdf-extract = "0.12"
tempfile = "3"
