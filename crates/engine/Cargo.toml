[package]
version = "0.9.0"
name = "engine"
edition = "2021"
description = "In-process transcription, diarization and LLM engine: the whole of what the Python service used to do"

[dependencies]
wire = { path = "../wire" }
vault = { path = "../vault" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# `bundled` compiles SQLite from source rather than trusting whatever the host
# has: the ledger is a user's own history, and its schema migrations must not
# depend on a system library's version.
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
