# Keeps a standing release PR up to date.
#
# On every push to `main`, git-cliff reads the conventional commits since the
# most recent `v*` tag and decides the next version. If there is one, this
# opens (or force-updates) a single `chore/release` PR carrying the version
# bump and the regenerated CHANGELOG.md. Merging that PR is what cuts the
# release — `release.yml` picks it up from there.
#
# The gate is the point: every merge to main accumulates into the PR, and
# nothing reaches a user until a human merges it. Cheap runner too — this job
# only edits files and opens a PR; the ~30-minute Windows installer build
# happens once, after the merge, not on every commit.

name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-pr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Full history *and* tags: git-cliff computes the bump from the range
      # since the last `v*` tag, so a shallow clone would silently produce a
      # changelog covering the wrong commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Compute next version and write it everywhere
        id: prepare
        run: |
          set +e
          version=$(uv run scripts/prepare_release.py)
          code=$?
          set -e
          # 3 is `prepare_release.py`'s documented "nothing to release" code:
          # a main branch carrying only docs/chore commits is the normal
          # state between releases, not a failure.
          if [ "$code" -eq 3 ]; then
            echo "nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the release PR
        if: steps.prepare.outputs.release == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/release
          # One standing branch, rewritten each time: the PR should always
          # describe the release as it stands now, not accumulate a history
          # of superseded bumps.
          base: main
          title: "chore(release): ${{ steps.prepare.outputs.version }}"
          commit-message: "chore(release): ${{ steps.prepare.outputs.version }}"
          labels: release
          delete-branch: true
          body: |
            Merging this PR releases **${{ steps.prepare.outputs.version }}**.

            It bumps `version.txt`, the five manifests and the two `Cargo.lock`
            workspace-member entries, and regenerates `CHANGELOG.md` from the
            conventional commits since the last tag.

            On merge, `release.yml` tags `v${{ steps.prepare.outputs.version }}`,
            builds the Windows installer, and publishes the GitHub Release with
            the installer, its `.sha256` and the build manifest attached.

            This PR is rewritten by CI on every push to `main` — edit the commit
            messages, not this branch.
