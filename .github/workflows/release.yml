# Builds and publishes the release for a `v*` tag.
#
# The tag is the trigger and the single source of truth: `tag.yml` creates
# one on every bump-worthy merge to main (and dispatches this workflow at
# it, because tags pushed with the built-in GITHUB_TOKEN never fire `on:
# push` themselves), and a human pushing a `v*` tag by hand lands here the
# same way.
#
# The tag existing before the build is the price of that simplicity: if the
# installer build fails, the version looks cut but nothing is published.
# The recovery is cheap and safe -- fix whatever broke the runner and re-run
# this workflow on the same tag; the `check` job below makes a re-run of an
# already-published version a no-op instead of a duplicate release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Cheap gate on a Linux runner: guard against a mis-aimed manual dispatch
  # and against double-publishing, so the ~30-minute Windows builder only
  # ever spins up with real work to do.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A manual dispatch aimed at a branch has no version to release;
          # failing loudly beats guessing one from version.txt and publishing
          # a release no tag points at.
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::this workflow releases tags; dispatch it with --ref refs/tags/vX.Y.Z (got $GITHUB_REF)"
              exit 1
              ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The tag and the tree it points at must agree on the version, or
          # the installer would be built claiming a different version than
          # the release it is attached to.
          tree_version=$(tr -d '[:space:]' < version.txt)
          if [ "$tree_version" != "$version" ]; then
            echo "::error::tag v$version points at a tree whose version.txt says $tree_version"
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already published — nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: windows-latest
    # The installer build bakes a relocatable CPython, installs the frozen
    # dependency tree, builds Rust in release mode and runs NSIS. On a cold
    # runner that is a long job; the default 6h cap is far too loose to catch
    # a hang, and 30 minutes would be too tight for a cache miss.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop

      # Runs the same pipeline as `make installer`: version check, lock check,
      # pyenv bake, `tauri build --locked`, collect, and the 1.5 GB size gate.
      # Nothing about this build is release-specific — it is exactly what a
      # developer runs locally, which is what makes it worth trusting.
      # The signing key is what makes an update an *update* rather than an
      # arbitrary executable a client was talked into running. Without these
      # set, `createUpdaterArtifacts` fails the build rather than silently
      # publishing unsigned archives -- which is the right way round.
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: uv run scripts/build_installer.py

      # `gh release create` would fail on a missing asset anyway -- but with
      # a clear error naming the asset, before the release object exists,
      # rather than a partial release a user can already see.
      #
      # The installer's name comes from `sync_version.artifact_name`, the same
      # function `build_installer.py` names the file with, so the workflow
      # cannot drift from the builder by spelling the pattern out itself.
      - name: Verify the release assets exist
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          installer="dist/$(uv run scripts/sync_version.py --print-artifact-name)"
          missing=0
          for asset in "$installer" "$installer.sha256" dist/build-manifest.json; do
            if [ ! -s "$asset" ]; then
              echo "::error::release asset missing or empty: $asset"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "dist/ contains:"
            ls -la dist/ || echo "  (no dist directory at all)"
            exit 1
          fi
          # An NSIS installer that is somehow a few KB is a failed build that
          # exited 0. Anything real here is tens of megabytes.
          size=$(stat -c%s "$installer")
          if [ "$size" -lt 10000000 ]; then
            echo "::error::installer is only $size bytes -- that is not a real build"
            exit 1
          fi
          echo "installer=$installer" >> "$GITHUB_OUTPUT"
          echo "verified $installer ($size bytes) plus its checksum and manifest"

      - name: Extract this version's changelog section
        id: notes
        shell: bash
        run: |
          version="${{ needs.check.outputs.version }}"
          # The section runs from this version's heading to the next `## `.
          awk -v v="$version" '
            $0 ~ "^## " v " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for the changes in this release." > release-notes.md
          fi

      # The manifest the installed app polls. Built here rather than by the
      # bundler because only this job knows the URL these assets will end up
      # at, and written from the *signature file the build actually
      # produced* -- so a manifest can never claim a signature that was not
      # made for these bytes.
      #
      # Assembled in Python rather than shell: `notes` is arbitrary prose
      # from CHANGELOG.md, and hand-escaping that into JSON with sed is how
      # a release ends up publishing a manifest no client can parse. A
      # malformed manifest reads as "no update available" to the updater,
      # which would fail silently forever.
      - name: Assemble the update manifest
        shell: bash
        run: |
          set -euo pipefail
          archive=$(ls target/release/bundle/nsis/*.nsis.zip)
          cp "$archive" "$archive.sig" .
          echo "archive=$(basename "$archive")" >> "$GITHUB_ENV"

          python - <<'PY'
          import json, os, pathlib, datetime

          version = os.environ["VERSION"]
          archive = next(pathlib.Path("target/release/bundle/nsis").glob("*.nsis.zip"))
          signature = pathlib.Path(f"{archive}.sig").read_text(encoding="utf-8").strip()
          notes = pathlib.Path("release-notes.md").read_text(encoding="utf-8").strip()
          base = f"https://github.com/{os.environ['REPO']}/releases/download/v{version}"

          pathlib.Path("latest.json").write_text(
              json.dumps(
                  {
                      "version": version,
                      "notes": notes[:4000],
                      "pub_date": datetime.datetime.now(datetime.UTC)
                      .replace(microsecond=0)
                      .isoformat()
                      .replace("+00:00", "Z"),
                      "platforms": {
                          "windows-x86_64": {
                              "signature": signature,
                              "url": f"{base}/{archive.name}",
                          }
                      },
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          print(f"latest.json points at {base}/{archive.name}")
          PY
        env:
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          archive="${{ env.archive }}"
          gh release create "v$version" \
            --title "Transcriber $version" \
            --notes-file release-notes.md \
            "${{ steps.assets.outputs.installer }}" \
            "${{ steps.assets.outputs.installer }}.sha256" \
            "dist/build-manifest.json" \
            "latest.json" \
            "$archive" \
            "$archive.sig"

      # `gh release create` can succeed with a partial upload if an asset is
      # rejected after the release object is made. Read the published release
      # back and confirm the installer is actually attached and non-empty --
      # the whole point of the release is that one file.
      - name: Confirm the installer is attached to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          installer_name=$(basename "${{ steps.assets.outputs.installer }}")
          size=$(gh release view "v$version" \
            --json assets \
            --jq ".assets[] | select(.name == \"$installer_name\") | .size")
          if [ -z "$size" ]; then
            echo "::error::v$version published without $installer_name attached"
            gh release view "v$version" --json assets --jq '.assets[].name'
            exit 1
          fi
          echo "v$version has $installer_name attached ($size bytes)"
