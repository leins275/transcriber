# Builds and publishes the release for a `v*` tag.
#
# The tag is the trigger and the single source of truth: `tag.yml` creates
# one on every bump-worthy merge to main (and dispatches this workflow at
# it, because tags pushed with the built-in GITHUB_TOKEN never fire `on:
# push` themselves), and a human pushing a `v*` tag by hand lands here the
# same way.
#
# The tag existing before the build is the price of that simplicity: if the
# installer build fails, the version looks cut but nothing is published.
# The recovery is cheap and safe -- fix whatever broke the runner and re-run
# this workflow on the same tag; the `check` job below makes a re-run of an
# already-published version a no-op instead of a duplicate release.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Cheap gate on a Linux runner: guard against a mis-aimed manual dispatch
  # and against double-publishing, so the ~30-minute Windows builder only
  # ever spins up with real work to do.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - id: decide
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A manual dispatch aimed at a branch has no version to release;
          # failing loudly beats guessing one from version.txt and publishing
          # a release no tag points at.
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::this workflow releases tags; dispatch it with --ref refs/tags/vX.Y.Z (got $GITHUB_REF)"
              exit 1
              ;;
          esac
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The tag and the tree it points at must agree on the version, or
          # the installer would be built claiming a different version than
          # the release it is attached to.
          tree_version=$(tr -d '[:space:]' < version.txt)
          if [ "$tree_version" != "$version" ]; then
            echo "::error::tag v$version points at a tree whose version.txt says $tree_version"
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already published — nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  # One leg per platform, in parallel: the Windows NSIS installer and the
  # macOS (Apple Silicon) dmg. Each leg runs the same `build_installer.py`
  # pipeline a developer runs locally, stages its artifacts under a
  # per-platform name, and uploads them for the fan-in `publish` job below --
  # the release object itself is only ever created once, after *both* legs
  # succeed, so a failed leg leaves no partial release behind.
  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            slug: windows-x86_64
          - os: macos-14 # Apple Silicon (arm64) runner
            slug: darwin-aarch64
    runs-on: ${{ matrix.os }}
    # The installer build bakes a relocatable CPython, installs the frozen
    # dependency tree, builds Rust in release mode and bundles. On a cold
    # runner that is a long job; the default 6h cap is far too loose to catch
    # a hang, and 30 minutes would be too tight for a cache miss.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop

      # Runs the same pipeline as `make installer`: version check, lock check,
      # pyenv bake, `tauri build --locked`, collect, and the 1.5 GB size gate.
      # Nothing about this build is release-specific — it is exactly what a
      # developer runs locally, which is what makes it worth trusting.
      # The signing key is what makes an update an *update* rather than an
      # arbitrary executable a client was talked into running. Without these
      # set, `createUpdaterArtifacts` fails the build rather than silently
      # publishing unsigned archives -- which is the right way round.
      #
      # The macOS app is NOT Apple-signed or notarized yet (no Developer ID):
      # first launch needs right-click -> Open. When a certificate exists,
      # signing/notarization slots in here via:
      #   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD /
      #   APPLE_SIGNING_IDENTITY / APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
      #
      # The pyannote speaker models the installer ships are committed to the
      # repository (apps/desktop/src-tauri/resources/models/), so this build
      # needs no Hugging Face access; the pipeline only checks they match
      # the service's pins.
      - name: Build installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: uv run scripts/build_installer.py

      # Everything the publish job needs from this leg, verified and staged
      # under stable names. The installer's name comes from
      # `sync_version.artifact_name`, the same function `build_installer.py`
      # names the file with, so the workflow cannot drift from the builder by
      # spelling the pattern out itself. build-manifest.json is renamed
      # per-platform because both legs produce one.
      #
      # The updater consumes different artifacts per platform: on Windows,
      # `createUpdaterArtifacts` signs the NSIS installer itself
      # (`<installer>.exe.sig`); on macOS it produces a separate
      # `Transcriber.app.tar.gz` + `.sig` -- the .dmg is first-install media
      # only and is published unsigned (checksummed).
      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          installer="dist/$(uv run scripts/sync_version.py --print-artifact-name)"
          missing=0
          for asset in "$installer" "$installer.sha256" dist/build-manifest.json; do
            if [ ! -s "$asset" ]; then
              echo "::error::release asset missing or empty: $asset"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "dist/ contains:"
            ls -la dist/ || echo "  (no dist directory at all)"
            exit 1
          fi
          # An installer that is somehow a few KB is a failed build that
          # exited 0. Anything real here is hundreds of megabytes.
          size=$(wc -c < "$installer" | tr -d '[:space:]')
          if [ "$size" -lt 10000000 ]; then
            echo "::error::installer is only $size bytes -- that is not a real build"
            exit 1
          fi
          mkdir -p stage
          cp "$installer" "$installer.sha256" stage/
          cp dist/build-manifest.json "stage/build-manifest-${{ matrix.slug }}.json"
          if [ "${{ matrix.slug }}" = "windows-x86_64" ]; then
            sig="target/release/bundle/nsis/$(basename "$installer").sig"
            if [ ! -s "$sig" ]; then
              echo "::error::updater signature missing: $sig -- was TAURI_SIGNING_PRIVATE_KEY set for the build?"
              ls -la target/release/bundle/nsis/ || true
              exit 1
            fi
            cp "$sig" "stage/$(basename "$installer").sig"
          else
            updater_archive="target/release/bundle/macos/Transcriber.app.tar.gz"
            for asset in "$updater_archive" "$updater_archive.sig"; do
              if [ ! -s "$asset" ]; then
                echo "::error::macOS updater artifact missing: $asset -- was TAURI_SIGNING_PRIVATE_KEY set for the build?"
                ls -la target/release/bundle/macos/ || true
                exit 1
              fi
            done
            cp "$updater_archive" "$updater_archive.sig" stage/
          fi
          echo "staged for ${{ matrix.slug }}:"
          ls -la stage/

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.slug }}
          path: stage/
          if-no-files-found: error

  # Fan-in: download both legs' staged assets, assemble one combined update
  # manifest, and create the release exactly once with everything attached.
  publish:
    needs: [check, build]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # For CHANGELOG.md and version.txt only.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Extract this version's changelog section
        shell: bash
        run: |
          version="${{ needs.check.outputs.version }}"
          # The section runs from this version's heading to the next `## `.
          awk -v v="$version" '
            $0 ~ "^## " v " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "See CHANGELOG.md for the changes in this release." > release-notes.md
          fi

      # The manifest the installed app polls. Built here rather than by the
      # bundler because only this job knows the URL these assets will end up
      # at, and written from the *signature files the builds actually
      # produced* -- so a manifest can never claim a signature that was not
      # made for these bytes.
      #
      # Per platform the updater downloads different things: on Windows the
      # NSIS installer itself (signed in place, no separate archive -- the
      # legacy `.nsis.zip` is the `v1Compatible` layout this does not use),
      # with `plugins.updater.windows.installMode: "passive"` as the client
      # half; on macOS the `Transcriber.app.tar.gz` updater archive, never
      # the .dmg.
      #
      # Assembled in Python rather than shell: `notes` is arbitrary prose
      # from CHANGELOG.md, and hand-escaping that into JSON with sed is how
      # a release ends up publishing a manifest no client can parse. A
      # malformed manifest reads as "no update available" to the updater,
      # which would fail silently forever.
      - name: Assemble the update manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import sys

          version = os.environ["VERSION"]
          assets = pathlib.Path("assets")
          base = f"https://github.com/{os.environ['REPO']}/releases/download/v{version}"

          def signed_platform(artifact: pathlib.Path) -> dict:
              signature = artifact.with_name(artifact.name + ".sig")
              if not signature.is_file():
                  sys.exit(f"::error::updater signature missing for {artifact.name}")
              return {
                  "signature": signature.read_text(encoding="utf-8").strip(),
                  "url": f"{base}/{artifact.name}",
              }

          installers = sorted(assets.glob("*.exe"))
          if len(installers) != 1:
              sys.exit(f"::error::expected exactly one staged .exe, found {installers}")
          mac_archive = assets / "Transcriber.app.tar.gz"
          if not mac_archive.is_file():
              sys.exit("::error::macOS updater archive Transcriber.app.tar.gz was not staged")

          notes = pathlib.Path("release-notes.md").read_text(encoding="utf-8").strip()
          pathlib.Path("latest.json").write_text(
              json.dumps(
                  {
                      "version": version,
                      "notes": notes[:4000],
                      "pub_date": datetime.datetime.now(datetime.UTC)
                      .replace(microsecond=0)
                      .isoformat()
                      .replace("+00:00", "Z"),
                      "platforms": {
                          "windows-x86_64": signed_platform(installers[0]),
                          "darwin-aarch64": signed_platform(mac_archive),
                      },
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          print(f"latest.json covers {installers[0].name} and {mac_archive.name}")
          PY
        env:
          VERSION: ${{ needs.check.outputs.version }}
          REPO: ${{ github.repository }}

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          gh release create "v$version" \
            --title "Transcriber $version" \
            --notes-file release-notes.md \
            assets/* \
            latest.json

      # `gh release create` can succeed with a partial upload if an asset is
      # rejected after the release object is made. Read the published release
      # back and confirm both installers and the macOS updater archive are
      # actually attached -- the whole point of the release is those files.
      - name: Confirm the installers are attached to the published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          exe_name=$(basename assets/*.exe)
          dmg_name=$(basename assets/*.dmg)
          failed=0
          for name in "$exe_name" "$dmg_name" "Transcriber.app.tar.gz"; do
            size=$(gh release view "v$version" \
              --json assets \
              --jq ".assets[] | select(.name == \"$name\") | .size")
            if [ -z "$size" ]; then
              echo "::error::v$version published without $name attached"
              failed=1
            else
              echo "v$version has $name attached ($size bytes)"
            fi
          done
          if [ "$failed" -ne 0 ]; then
            gh release view "v$version" --json assets --jq '.assets[].name'
            exit 1
          fi
