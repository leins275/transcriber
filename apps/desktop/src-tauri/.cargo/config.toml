# FR-9: statically link the MSVC C runtime so the installed app has no
# VCRUNTIME140.dll dependency (no separate redistributable to detect/install).
#
# Fallback (per plan.md T6), if `crt-static` ever breaks a native dependency
# in this workspace: drop this override and instead bundle the VC++
# redistributable DLLs as `bundle.resources` in ../tauri.conf.json, restoring
# the dynamic CRT. As of this task, `cargo build -p transcriber-desktop` and
# `cargo build --workspace` both compile cleanly with crt-static enabled, so
# no fallback is in effect.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# `knf-rs-sys` (pulled in by pyannote-rs) picks its MSVC runtime from its own
# `KNF_STATIC_CRT`, not from `target-feature=+crt-static` above -- it defaults
# to the dynamic CRT, and then its objects import `__imp_rand` while the rest
# of the link uses `libcmt`, so linking the debug cdylib fails with LNK2019.
# This has to stay in the same file as the flag it is matching.
[env]
KNF_STATIC_CRT = "1"
