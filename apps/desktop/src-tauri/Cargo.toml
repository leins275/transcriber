[package]
name = "transcriber-desktop"
version = "0.4.0"
edition = "2021"
rust-version = "1.98"
description = "Transcriber desktop app — drag-and-drop meeting ingest and transcription status"
authors = ["Transcriber"]

[lib]
name = "transcriber_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
async-trait = "0.1"
vault = { path = "../../../crates/vault" }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
