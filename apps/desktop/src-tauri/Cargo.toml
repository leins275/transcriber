[package]
name = "transcriber-desktop"
version = "0.9.0"
edition = "2021"
rust-version = "1.98"
description = "Transcriber desktop app — drag-and-drop meeting ingest and transcription status"
authors = ["Transcriber"]

[lib]
name = "transcriber_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "io-util", "sync"] }
async-trait = "0.1"
vault = { path = "../../../crates/vault" }
# The in-process engine that replaces the Python sidecar. It knows nothing
# about Tauri; this is the only direction the dependency runs.
engine = { path = "../../../crates/engine" }
wire = { path = "../../../crates/wire" }
# Only for the download-status types the engine surfaces; the desktop crate
# itself still makes no outbound requests.
fetcher = { path = "../../../crates/fetcher" }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Screenshot bytes cross the IPC boundary as data URLs (the webview has no
# filesystem access by design).
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
# `#[tokio::test]` only. This used to arrive transitively through wiremock,
# which went away with the HTTP binding it existed to fake.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
